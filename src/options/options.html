<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nyhetsoppsummering – innstillinger</title>
    <style>
      body {
        font:
          15px/1.5 system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
        max-width: 460px;
        margin: 2.5rem auto;
        padding: 0 1.25rem;
        color: #1f2937;
      }
      h1 {
        font-size: 1.25rem;
      }
      label {
        display: block;
        margin: 1.1rem 0 0.3rem;
        font-weight: 600;
      }
      input,
      select {
        width: 100%;
        padding: 0.55rem;
        box-sizing: border-box;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font: inherit;
      }
      .hint {
        margin-top: 0.3rem;
        color: #6b7280;
        font-size: 0.85rem;
      }
      button {
        margin-top: 1.75rem;
        padding: 0.6rem 1.2rem;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 6px;
        font: inherit;
        cursor: pointer;
      }
      .model-row {
        display: flex;
        gap: 0.5rem;
      }
      button.secondary {
        margin-top: 0;
        background: #e5e7eb;
        color: #1f2937;
        flex: none;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .key-status.ok {
        color: #047857;
      }
      .key-status.bad {
        color: #b91c1c;
      }
      .status {
        margin-top: 1rem;
        min-height: 1.2rem;
        color: #047857;
      }
    </style>
  </head>
  <body>
    <h1>Nyhetsoppsummering</h1>
    <p class="hint">Pek på en artikkellenke, høyreklikk «Oppsummer artikkel» eller trykk Alt+S.</p>

    <label for="provider">Leverandør</label>
    <select id="provider">
      <option value="anthropic">Anthropic</option>
      <option value="openai">OpenAI</option>
    </select>

    <label for="apiKey">API-nøkkel</label>
    <input id="apiKey" type="password" autocomplete="off" />
    <p class="hint">Lagres kun lokalt i nettleseren, én nøkkel per leverandør.</p>
    <p class="hint key-status" id="keyStatus"></p>

    <label for="model">Modell</label>
    <div class="model-row">
      <select id="model"></select>
      <button id="refresh" type="button" class="secondary" title="Hent modellisten på nytt">
        Oppdater
      </button>
    </div>
    <p class="hint" id="modelStatus"></p>

    <label for="effort">Tenkenivå</label>
    <select id="effort">
      <option value="default">Modellens standard</option>
      <option value="low">Lavt (raskere og billigere)</option>
    </select>
    <p class="hint">Noen eldre modeller støtter ikke dette og gir feil. Velg da standard.</p>

    <button id="save">Lagre</button>
    <p class="status" id="status"></p>

    <script type="module" src="./options.ts"></script>
  </body>
</html>
